name: Publish on NPM

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Prepare Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y can-utils
          sudo apt-get install -y libnode-dev
          # Newer kernels ship vcan in the base linux-modules package and have no
          # linux-modules-extra package, so only install it when vcan is missing.
          if ! modinfo vcan > /dev/null 2>&1; then
            sudo apt-get install -y linux-modules-extra-$(uname -r)
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm run configure
          pnpm run build:all

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: |
          sh prepare_test_env.sh
          pnpm test

      - name: Publish
        run: npm publish
